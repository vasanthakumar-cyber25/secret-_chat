<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secret Chat</title>
  <style>
    body { font-family: Arial, sans-serif; background: #121212; color: #fff; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
    .container { width: 100%; max-width: 450px; background: #1e1e1e; padding: 15px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    input, button { padding: 10px; margin: 5px 0; border-radius: 6px; border: none; outline: none; }
    input[type="text"], input[type="password"] { width: calc(100% - 22px); background: #2a2a2a; color: #fff; }
    button { background: #007bff; color: white; cursor: pointer; font-weight: bold; }
    #chat-box { height: 300px; border: 1px solid #333; overflow-y: auto; padding: 10px; border-radius: 6px; background: #181818; margin-bottom: 10px; display: flex; flex-direction: column; }
    .msg { margin: 5px 0; padding: 8px 12px; border-radius: 8px; max-width: 80%; word-break: break-word; }
    .sent { background: #005c4b; align-self: flex-end; }
    .received { background: #202c33; align-self: flex-start; }
    .controls { display: flex; gap: 5px; align-items: center; }
    img, audio { max-width: 100%; border-radius: 6px; margin-top: 5px; }
    #call-bar { display: none; background: #28a745; padding: 10px; text-align: center; border-radius: 6px; margin-bottom: 10px; }
  </style>
</head>
<body>

<div class="container">
  <h2>🔒 Secret Chat</h2>
  
  <div id="setup-screen">
    <input type="text" id="room" placeholder="Enter Room Name">
    <input type="password" id="key" placeholder="Enter Shared Secret Key">
    <button onclick="joinRoom()">Join Chat</button>
  </div>

  <div id="chat-screen" style="display:none;">
    <div id="call-bar">
      <span>📞 Voice Call Connected</span>
      <button onclick="endCall()" style="background:red;">End</button>
    </div>

    <div style="display:flex; justify-content:space-between; margin-bottom: 10px;">
      <button onclick="startCall()">📞 Call</button>
      <button onclick="document.getElementById('file-input').click()">📷 Photo</button>
      <button id="rec-btn" onclick="toggleRecord()">🎤 Record</button>
    </div>

    <input type="file" id="file-input" accept="image/*" style="display:none" onchange="sendImage(event)">
    <audio id="remote-audio" autoplay></audio>

    <div id="chat-box"></div>

    <div class="controls">
      <input type="text" id="message" placeholder="Type message or emoji...">
      <button onclick="sendText()">Send</button>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io();
  let roomId, secretKey, peerConnection, localStream;
  let isRecording = false, mediaRecorder, audioChunks = [];

  const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

  function xorEncrypt(text, key) {
    let result = '';
    for (let i = 0; i < text.length; i++) {
      result += String.fromCharCode(text.charCodeAt(i) ^ key.charCodeAt(i % key.length));
    }
    return btoa(result);
  }

  function xorDecrypt(cipher, key) {
    try {
      let text = atob(cipher);
      let result = '';
      for (let i = 0; i < text.length; i++) {
        result += String.fromCharCode(text.charCodeAt(i) ^ key.charCodeAt(i % key.length));
      }
      return result;
    } catch { return "⚠️ Decryption Error"; }
  }

  function joinRoom() {
    roomId = document.getElementById('room').value;
    secretKey = document.getElementById('key').value;
    if (!roomId || !secretKey) return alert("Fill all fields");
    socket.emit('join-room', roomId);
    document.getElementById('setup-screen').style.display = 'none';
    document.getElementById('chat-screen').style.display = 'block';
  }

  function appendMsg(content, type, isMedia = false) {
    const box = document.getElementById('chat-box');
    const div = document.createElement('div');
    div.className = `msg ${type}`;
    if (isMedia) div.innerHTML = content;
    else div.textContent = content;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
  }

  function sendText() {
    const msgInput = document.getElementById('message');
    if (!msgInput.value) return;
    const encrypted = xorEncrypt(msgInput.value, secretKey);
    socket.emit('send-message', { roomId, data: encrypted, type: 'text' });
    appendMsg(msgInput.value, 'sent');
    msgInput.value = '';
  }

  function sendImage(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function() {
      const encrypted = xorEncrypt(reader.result, secretKey);
      socket.emit('send-message', { roomId, data: encrypted, type: 'image' });
      appendMsg(`<img src="${reader.result}">`, 'sent', true);
    };
    reader.readAsDataURL(file);
  }

  async function toggleRecord() {
    const btn = document.getElementById('rec-btn');
    if (!isRecording) {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      audioChunks = [];
      mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
      mediaRecorder.onstop = () => {
        const blob = new Blob(audioChunks, { type: 'audio/webm' });
        const reader = new FileReader();
        reader.onload = () => {
          const encrypted = xorEncrypt(reader.result, secretKey);
          socket.emit('send-message', { roomId, data: encrypted, type: 'audio' });
          appendMsg(`<audio controls src="${reader.result}"></audio>`, 'sent', true);
        };
        reader.readAsDataURL(blob);
      };
      mediaRecorder.start();
      isRecording = true;
      btn.textContent = "🛑 Stop";
    } else {
      mediaRecorder.stop();
      isRecording = false;
      btn.textContent = "🎤 Record";
    }
  }

  socket.on('receive-message', ({ data, type }) => {
    const decrypted = xorDecrypt(data, secretKey);
    if (type === 'text') appendMsg(decrypted, 'received');
    else if (type === 'image') appendMsg(`<img src="${decrypted}">`, 'received', true);
    else if (type === 'audio') appendMsg(`<audio controls src="${decrypted}"></audio>`, 'received', true);
  });

  // --- WebRTC Voice Call Logic ---
  async function startCall() {
    localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    peerConnection = new RTCPeerConnection(rtcConfig);
    localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

    peerConnection.onicecandidate = e => {
      if (e.candidate) socket.emit('ice-candidate', { roomId, candidate: e.candidate });
    };

    peerConnection.ontrack = e => {
      document.getElementById('remote-audio').srcObject = e.streams[0];
    };

    const offer = await peerConnection.createOffer();
    await peerConnection.setLocalDescription(offer);
    socket.emit('call-user', { roomId, signal: offer });
    document.getElementById('call-bar').style.display = 'block';
  }

  socket.on('call-made', async ({ signal }) => {
    if (confirm("Incoming Audio Call. Accept?")) {
      localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      peerConnection = new RTCPeerConnection(rtcConfig);
      localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

      peerConnection.onicecandidate = e => {
        if (e.candidate) socket.emit('ice-candidate', { roomId, candidate: e.candidate });
      };

      peerConnection.ontrack = e => {
        document.getElementById('remote-audio').srcObject = e.streams[0];
      };

      await peerConnection.setRemoteDescription(new RTCSessionDescription(signal));
      const answer = await peerConnection.createAnswer();
      await peerConnection.setLocalDescription(answer);
      socket.emit('make-answer', { roomId, signal: answer });
      document.getElementById('call-bar').style.display = 'block';
    }
  });

  socket.on('answer-made', async ({ signal }) => {
    await peerConnection.setRemoteDescription(new RTCSessionDescription(signal));
  });

  socket.on('ice-candidate', async candidate => {
    if (peerConnection) await peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
  });

  function endCall() {
    socket.emit('end-call', roomId);
    closeCall();
  }

  socket.on('call-ended', closeCall);

  function closeCall() {
    if (peerConnection) peerConnection.close();
    document.getElementById('call-bar').style.display = 'none';
  }
</script>
</body>
</html>
